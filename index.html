<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Gourmet ranking list</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --hover: #fbfbfd;
      --text: #1d1d1f;
      --text-body: #424245;
      --text-2: #6e6e73;
      --text-3: #86868b;
      --text-4: #aeaeb2;
      --hairline: rgba(0, 0, 0, 0.07);
      --accent: #0071e3;
      --track: #e8e8ed;
      --radius-panel: 22px;
      --radius-sheet: 16px;
      --shadow-panel: 0 1px 3px rgba(0,0,0,.05), 0 14px 40px rgba(0,0,0,.05);
      --shadow-overlay: 0 2px 8px rgba(0,0,0,.10), 0 30px 80px rgba(0,0,0,.24);
      --ease-out: cubic-bezier(.23, 1, .32, 1);
      --ease-spring: cubic-bezier(.32, .72, 0, 1);
      --rank-collapsed-height: 172px;
      --rank-list-height: 118px;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); font-optical-sizing: auto; }
    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .filter-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px 22px;
      background: rgba(245,245,247,.76);
      border-bottom: 1px solid transparent;
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      transition: border-color 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
    }
    .filter-bar.scrolled {
      border-bottom-color: var(--hairline);
      box-shadow: 0 1px 12px rgba(0,0,0,.04);
    }
    .filter-control { position: relative; min-width: 150px; }
    .filter-trigger {
      width: 100%;
      height: 44px;
      padding: 0 38px 0 16px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      outline: none;
      color: var(--text);
      background: rgba(255,255,255,.88);
      font-size: 14px;
      font-weight: 550;
      text-align: left;
      cursor: pointer;
      transition: border-color 180ms var(--ease-out), box-shadow 180ms var(--ease-out), transform 120ms var(--ease-out);
    }
    .filter-trigger::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 16px;
      width: 7px;
      height: 7px;
      border-right: 1.5px solid var(--text-3);
      border-bottom: 1.5px solid var(--text-3);
      transform: translateY(-70%) rotate(45deg);
      transition: transform 180ms var(--ease-out);
      pointer-events: none;
    }
    .filter-control.open .filter-trigger::after { transform: translateY(-30%) rotate(225deg); }
    .filter-trigger.selected { border-color: rgba(0,113,227,.35); color: var(--accent); }
    .filter-trigger:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0,113,227,.14); }
    .filter-trigger:active { transform: scale(.98); }
    .filter-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      z-index: 20;
      width: max-content;
      min-width: 196px;
      max-width: min(320px, calc(100vw - 28px));
      padding: 8px;
      border: 1px solid rgba(0,0,0,.10);
      border-radius: var(--radius-sheet);
      background: rgba(255,255,255,.88);
      box-shadow: var(--shadow-overlay);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -6px) scale(.98);
      transform-origin: top center;
      transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
    }
    .filter-control.open .filter-menu { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) scale(1); }
    .filter-option {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      padding: 0 10px;
      border-radius: 10px;
      color: var(--text-body);
      font-size: 14px;
      font-weight: 550;
      cursor: pointer;
    }
    .filter-option:hover { background: rgba(0,0,0,.045); }
    .filter-option input {
      appearance: none;
      flex: 0 0 18px;
      width: 18px;
      height: 18px;
      margin: 0;
      border: 1px solid rgba(0,0,0,.18);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
    .filter-option input:checked { border-color: var(--accent); background: var(--accent); }
    .filter-option input:checked::after { content: "✓"; display: block; color: #fff; font-size: 13px; font-weight: 700; line-height: 16px; text-align: center; }
    .filter-option input:focus-visible { outline: 2px solid rgba(0,113,227,.45); outline-offset: 2px; }

    .search-float {
      position: fixed;
      right: max(20px, env(safe-area-inset-right));
      top: max(84px, env(safe-area-inset-top));
      z-index: 11;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px) scale(.96);
      transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out);
    }
    .search-float.is-visible { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
    .search-popover {
      position: absolute;
      top: 0;
      right: calc(100% + 10px);
      display: flex;
      align-items: center;
      width: min(320px, calc(100vw - 32px));
      height: 48px;
      padding: 0 7px 0 15px;
      border: 1px solid rgba(0,0,0,.10);
      border-radius: var(--radius-sheet);
      background: rgba(255,255,255,.88);
      box-shadow: var(--shadow-overlay);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      opacity: 0;
      pointer-events: none;
      transform: translateX(8px) scale(.98);
      transform-origin: top right;
      transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
    }
    .search-float.is-open .search-popover { opacity: 1; pointer-events: auto; transform: translateX(0) scale(1); }
    .search-icon {
      position: relative;
      flex: 0 0 15px;
      width: 15px;
      height: 15px;
      margin-right: 10px;
      border: 1.8px solid var(--text-3);
      border-radius: 50%;
    }
    .search-icon::after {
      content: "";
      position: absolute;
      right: -5px;
      bottom: -3px;
      width: 6px;
      border-top: 1.8px solid var(--text-3);
      transform: rotate(48deg);
      transform-origin: left center;
    }
    .search-input {
      min-width: 0;
      flex: 1;
      height: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 14px;
      font-weight: 550;
    }
    .search-input::placeholder { color: var(--text-3); }
    .search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
    .search-clear, .search-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0,0,0,.10);
      color: var(--text);
      background: rgba(255,255,255,.88);
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.08);
      cursor: pointer;
      transition: background 180ms var(--ease-out), transform 120ms var(--ease-out), box-shadow 180ms var(--ease-out);
    }
    .search-clear {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      color: var(--text-2);
      background: transparent;
      box-shadow: none;
      font-size: 19px;
      line-height: 1;
    }
    .search-clear[hidden] { display: none; }
    .search-toggle { width: 48px; height: 48px; border-radius: 999px; }
    .search-toggle .search-icon { margin: 0 4px 4px 0; }
    .search-clear:active, .search-toggle:active { transform: scale(.94); }
    .search-input:focus-visible + .search-clear, .search-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    main {
      width: min(1080px, calc(100% - 44px));
      margin: clamp(28px, 6vw, 56px) auto;
    }
    .board {
      overflow: hidden;
      background: var(--surface);
      border-radius: var(--radius-panel);
      box-shadow: var(--shadow-panel);
    }
    .rank-section {
      display: grid;
      grid-template-columns: 138px minmax(0, 1fr);
      height: var(--rank-collapsed-height);
      min-height: var(--rank-collapsed-height);
    }
    .rank-section.expanded { height: auto; }
    .rank-section + .rank-section { border-top: 1px solid var(--hairline); }
    .rank-label {
      display: flex;
      align-items: flex-start;
      padding: 27px 22px;
      color: var(--text);
    }
    .rank-label h2 {
      margin: 0;
      font-size: clamp(20px, 2.4vw, 25px);
      line-height: 1.2;
      letter-spacing: -.025em;
    }
    .rank-section[data-rank="hang"] .rank-label { background: #f47867; }
    .rank-section[data-rank="top"] .rank-label { background: #f5a467; }
    .rank-section[data-rank="elite"] .rank-label { background: #efd274; }
    .rank-section[data-rank="npc"] .rank-label { background: #a9bd9a; }
    .rank-section[data-rank="bad"] .rank-label { background: #a3bac2; }
    .rank-content {
      position: relative;
      min-width: 0;
      height: var(--rank-collapsed-height);
      background: var(--surface);
    }
    .rank-section.expanded .rank-content { height: auto; min-height: var(--rank-collapsed-height); }
    .shop-chips {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 12px;
      height: var(--rank-list-height);
      padding: 18px 22px 0;
      overflow: hidden;
    }
    .rank-section.expanded .shop-chips {
      height: auto;
      min-height: var(--rank-list-height);
      padding-bottom: 54px;
      overflow: visible;
    }
    .shop-chip {
      min-height: 44px;
      max-width: 100%;
      padding: 0 18px;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 13px;
      color: var(--text);
      background: #fff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -.01em;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,.025);
      transition: color 160ms ease, background 160ms ease, transform 120ms var(--ease-out), box-shadow 160ms ease;
    }
    .shop-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .shop-chip:active { transform: scale(.97); }
    .more-button {
      position: absolute;
      right: 14px;
      bottom: 12px;
      z-index: 2;
      min-height: 34px;
      padding: 0 13px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(255,255,255,.94);
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 5px 16px rgba(0,0,0,.06);
      transition: background 160ms ease, transform 120ms var(--ease-out);
    }
    .more-button:active { transform: scale(.96); }
    .more-button[hidden] { display: none; }
    .rank-empty, .board-empty {
      display: flex;
      align-items: center;
      min-height: 44px;
      color: var(--text-4);
      font-size: 14px;
    }
    .board-empty { justify-content: center; min-height: 260px; }

    dialog {
      width: min(520px, calc(100% - 32px));
      max-height: min(720px, calc(100vh - 48px));
      margin: auto;
      padding: 0;
      overflow: visible;
      border: 0;
      border-radius: 26px;
      color: var(--text);
      background: transparent;
    }
    dialog::backdrop {
      background: rgba(0,0,0,.26);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      transition: opacity 180ms ease;
    }
    .detail-sheet {
      max-height: inherit;
      overflow: auto;
      padding: clamp(24px, 5vw, 34px);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 26px;
      background: rgba(245,245,247,.82);
      box-shadow: var(--shadow-overlay);
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      opacity: 0;
      transform: translateY(12px) scale(.98);
      transition: opacity 260ms var(--ease-spring), transform 260ms var(--ease-spring);
    }
    dialog[open] .detail-sheet { opacity: 1; transform: translateY(0) scale(1); }
    dialog.closing .detail-sheet { opacity: 0; transform: translateY(8px) scale(.985); transition-duration: 160ms; }
    .detail-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .detail-name { margin: 0; font-size: clamp(24px, 5vw, 32px); line-height: 1.15; letter-spacing: -.035em; }
    .close-button {
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 999px;
      color: var(--text-2);
      background: rgba(255,255,255,.72);
      font-size: 23px;
      line-height: 1;
      cursor: pointer;
      transition: background 160ms ease, transform 120ms var(--ease-out);
    }
    .close-button:active { transform: scale(.94); }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .meta-pill {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      color: var(--text-2);
      background: rgba(255,255,255,.7);
      font-size: 12px;
      font-weight: 600;
    }
    .detail-content { display: grid; gap: 22px; margin-top: 28px; }
    .detail-block h3 { margin: 0 0 7px; color: var(--text-3); font-size: 12px; font-weight: 650; }
    .detail-block p { margin: 0; color: var(--text-body); font-size: 16px; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere; }
    .detail-actions { display: flex; flex: 0 0 auto; align-items: center; margin-left: auto; padding: 0 8px 0 4px; }
    .dianping-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid rgba(0,0,0,.07);
      border-radius: 50%;
      color: var(--accent);
      background: rgba(255,255,255,.76);
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      text-decoration: none;
      transition: background 160ms var(--ease-out), box-shadow 160ms var(--ease-out), transform 120ms var(--ease-out);
    }
    .dianping-link::before { content: "↗"; font-size: 19px; font-weight: 500; line-height: 1; transform: translateY(-1px); }
    .dianping-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .dianping-link:active { transform: scale(.97); }

    @media (hover: hover) and (pointer: fine) {
      .shop-chip:hover { color: var(--accent); background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.08); transform: translateY(-1px); }
      .dianping-link:hover { background: rgba(255,255,255,.96); box-shadow: 0 5px 16px rgba(0,0,0,.12); transform: translateY(-1px); }
      .more-button:hover { background: #fff; }
      .close-button:hover { background: #fff; }
      .search-clear:hover, .search-toggle:hover { background: #fff; box-shadow: 0 5px 16px rgba(0,0,0,.12); }
    }
    @media (max-width: 680px) {
      :root { --rank-collapsed-height: 215px; --rank-list-height: 103px; }
      .filter-bar { justify-content: stretch; padding: 10px 14px; }
      .filter-control { flex: 1; min-width: 0; }
      .filter-trigger { padding: 0 28px 0 11px; font-size: 12px; }
      .filter-trigger::after { right: 13px; }
      .filter-menu { left: 0; min-width: 220px; transform: translate(0, -6px) scale(.98); transform-origin: top left; }
      .filter-control.open .filter-menu { transform: translate(0, 0) scale(1); }
      .filter-control:last-child .filter-menu { right: 0; left: auto; transform-origin: top right; }
      .filter-control:last-child.open .filter-menu { transform: translate(0, 0) scale(1); }
      .search-float { right: max(14px, env(safe-area-inset-right)); top: max(70px, env(safe-area-inset-top)); }
      .search-popover { width: min(240px, calc(100vw - 120px)); }
      .search-input { font-size: 16px; }
      main { width: calc(100% - 24px); margin: 20px auto 36px; }
      .rank-section { display: block; }
      .rank-section.expanded { height: auto; }
      .rank-label { min-height: 58px; padding: 18px 18px 14px; }
      .rank-label h2 { font-size: 20px; }
      .rank-content { height: 157px; }
      .rank-section.expanded .rank-content { height: auto; min-height: 157px; }
      .shop-chips { padding: 14px 14px 0; gap: 9px; }
      .rank-section.expanded .shop-chips { padding-bottom: 48px; }
      .shop-chip { min-height: 40px; padding: 0 14px; font-size: 14px; }
      .more-button { right: 12px; bottom: 9px; }
      dialog { width: calc(100% - 24px); }
      .detail-sheet { padding: 24px 20px; border-radius: var(--radius-panel); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .detail-sheet, dialog.closing .detail-sheet { transform: none; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .filter-bar, .detail-sheet, .search-popover, .search-toggle { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; }
      dialog::backdrop { backdrop-filter: none; -webkit-backdrop-filter: none; }
    }
    @media (prefers-contrast: more) {
      :root { --hairline: rgba(0,0,0,.22); }
      .filter-trigger, .detail-sheet { border-color: rgba(0,0,0,.32); }
    }
  </style>
</head>
<body>
  <div class="filter-bar" id="filter-bar" aria-label="榜单筛选">
    <div class="filter-control">
      <button class="filter-trigger" id="rank-filter" type="button" aria-label="按等级筛选" aria-expanded="false">全部等级</button>
      <div class="filter-menu" id="rank-menu" role="group" aria-label="选择等级"></div>
    </div>
    <div class="filter-control">
      <button class="filter-trigger" id="region-filter" type="button" aria-label="按地区筛选" aria-expanded="false">全部地区</button>
      <div class="filter-menu" id="region-menu" role="group" aria-label="选择地区"></div>
    </div>
    <div class="filter-control">
      <button class="filter-trigger" id="category-filter" type="button" aria-label="按类型筛选" aria-expanded="false">全部类型</button>
      <div class="filter-menu" id="category-menu" role="group" aria-label="选择类型"></div>
    </div>
  </div>
  <main>
    <div class="board" id="board"></div>
  </main>
  <div class="search-float" id="search-float" aria-hidden="true">
    <div class="search-popover" id="search-popover">
      <span class="search-icon" aria-hidden="true"></span>
      <input class="search-input" id="search-input" type="search" autocomplete="off" placeholder="搜索店名、地区或关键词" aria-label="搜索榜单">
      <button class="search-clear" id="search-clear" type="button" aria-label="清除搜索" hidden>×</button>
    </div>
    <button class="search-toggle" id="search-toggle" type="button" aria-label="打开搜索" aria-expanded="false"><span class="search-icon" aria-hidden="true"></span></button>
  </div>
  <dialog id="detail-dialog" aria-labelledby="detail-name">
    <div class="detail-sheet">
      <div class="detail-top">
        <div>
          <h2 class="detail-name" id="detail-name"></h2>
          <div class="detail-meta" id="detail-meta"></div>
        </div>
        <button class="close-button" id="detail-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="detail-content" id="detail-content"></div>
    </div>
  </dialog>
  <script>
    (() => {

      const categories = [...new Set(DATA.map((item) => getReviewCategory(item.review)).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, "zh-CN"));

      const filters = [
        { id: "rank", allLabel: "全部等级", values: new Set(), options: RANKS.map((rank) => [rank.id, rank.label]) },
        { id: "region", allLabel: "全部地区", values: new Set(), options: [...regions.map((region) => [region, region]), ...(DATA.some((item) => item.locationType === "chain") ? [["chain", "连锁"]] : [])] },
        { id: "category", allLabel: "全部类型", values: new Set(), options: categories.map((category) => [category, category]) },
      ].map((filter) => ({
        ...filter,
        control: document.getElementById(`${filter.id}-filter`).closest(".filter-control"),
        trigger: document.getElementById(`${filter.id}-filter`),
        menu: document.getElementById(`${filter.id}-menu`),
      }));
      const [rankFilter, regionFilter, categoryFilter] = filters;

      function closeFilters(except = null) {
        filters.forEach((filter) => {
          if (filter === except) return;
          filter.control.classList.remove("open");
          filter.trigger.setAttribute("aria-expanded", "false");
        });
      }

      function updateFilterLabel(filter) {
        const count = filter.values.size;
        filter.trigger.textContent = count ? `已选 ${count} 项` : filter.allLabel;
        filter.trigger.classList.toggle("selected", count > 0);
      }

      function buildFilterMenu(filter) {
        filter.options.forEach(([value, label]) => {
          const option = document.createElement("label");
          option.className = "filter-option";
          const input = document.createElement("input");
          input.type = "checkbox";
          input.value = value;
          input.addEventListener("change", () => {
            if (input.checked) filter.values.add(value);
            else filter.values.delete(value);
            updateFilterLabel(filter);
            render();
          });
          option.append(input, document.createTextNode(label));
          filter.menu.append(option);
        });
        filter.trigger.addEventListener("click", () => {
          const willOpen = !filter.control.classList.contains("open");
          closeFilters(filter);
          filter.control.classList.toggle("open", willOpen);
          filter.trigger.setAttribute("aria-expanded", String(willOpen));
        });
      }

      filters.forEach(buildFilterMenu);

      function matchesRegion(item) {
        const value = item.locationType === "chain" ? "chain" : item.region;
        return matchesSelectedValues(regionFilter.values, value);
      }

      function locationLabel(item) {
        return item.locationType === "chain" ? "连锁" : item.region;
      }

      function matchesCategory(item) {
        return matchesSelectedValues(categoryFilter.values, getReviewCategory(item.review));
      }

      function updateSearchVisibility(visible) {
        searchFloat.classList.toggle("is-visible", visible);
        searchFloat.setAttribute("aria-hidden", String(!visible));
      }

      function setSearchOpen(open) {
        searchFloat.classList.toggle("is-open", open);
        searchToggle.setAttribute("aria-expanded", String(open));
        searchToggle.setAttribute("aria-label", open ? "收起搜索" : "打开搜索");
        if (open) {
          updateSearchVisibility(true);
          clearTimeout(searchHideTimer);
          requestAnimationFrame(() => searchInput.focus());
        } else if (!searchQuery) {
          scheduleSearchHide();
        }
      }

      function scheduleSearchHide() {
        clearTimeout(searchHideTimer);
        if (searchFloat.classList.contains("is-open") || searchQuery) return;
        searchHideTimer = setTimeout(() => updateSearchVisibility(false), SEARCH_HIDE_DELAY);
      }

      function revealSearchOnScroll() {
        updateSearchVisibility(true);
        scheduleSearchHide();
      }

      function syncMoreButtons() {
        document.querySelectorAll(".rank-section").forEach((section) => {
          const chips = section.querySelector(".shop-chips");
          const button = section.querySelector(".more-button");
          if (!chips || !button) return;
          const expanded = section.classList.contains("expanded");
          button.hidden = !expanded && chips.scrollHeight <= chips.clientHeight + 1;
          button.textContent = expanded ? "收起" : "查看更多";
        });
      }

      function render() {
        board.replaceChildren();
        const visibleRanks = RANKS.filter((rank) => matchesSelectedValues(rankFilter.values, rank.id));
        let visibleCount = 0;

        visibleRanks.forEach((rank) => {
          const section = document.createElement("section");
          section.className = "rank-section";
          section.dataset.rank = rank.id;
          section.classList.toggle("expanded", expandedRanks.has(rank.id));
          const label = document.createElement("div");
          label.className = "rank-label";
          const heading = document.createElement("h2");
          heading.textContent = rank.label;
          label.append(heading);
          const content = document.createElement("div");
          content.className = "rank-content";
          const list = document.createElement("div");
          list.className = "shop-chips";

          const items = sortEntriesByName(DATA.filter((item) => item.rank === rank.id && matchesRegion(item) && matchesCategory(item) && matchesSearchQuery(item, searchQuery)));
          visibleCount += items.length;
          if (!items.length) {
            const empty = document.createElement("div");
            empty.className = "rank-empty";
            empty.textContent = "暂无";
            list.append(empty);
          } else {
            items.forEach((item) => {
              const button = document.createElement("button");
              button.type = "button";
              button.className = "shop-chip";
              button.textContent = item.name;
              button.addEventListener("click", () => openDetail(item));
              list.append(button);
            });
          }
          content.append(list);
          if (items.length) {
            const moreButton = document.createElement("button");
            moreButton.type = "button";
            moreButton.className = "more-button";
            moreButton.hidden = true;
            moreButton.textContent = expandedRanks.has(rank.id) ? "收起" : "查看更多";
            moreButton.addEventListener("click", () => {
              if (expandedRanks.has(rank.id)) expandedRanks.delete(rank.id);
              else expandedRanks.add(rank.id);
              render();
            });
            content.append(moreButton);
          }
          section.append(label, content);
          board.append(section);
        });

        if (!visibleCount && !visibleRanks.length) {
          const empty = document.createElement("div");
          empty.className = "board-empty";
          empty.textContent = "没有符合条件的店铺";
          board.append(empty);
        }
        requestAnimationFrame(syncMoreButtons);
      }

      function addMeta(text) {
        const span = document.createElement("span");
        span.className = "meta-pill";
        span.textContent = text;
        document.getElementById("detail-meta").append(span);
      }

      function addDetail(label, text) {
        if (!text) return;
        const block = document.createElement("section");
        block.className = "detail-block";
        const heading = document.createElement("h3");
        heading.textContent = label;
        const paragraph = document.createElement("p");
        paragraph.textContent = text;
        block.append(heading, paragraph);
        document.getElementById("detail-content").append(block);
      }

      function openDetail(item) {
        document.getElementById("detail-name").textContent = item.name;
        document.getElementById("detail-meta").replaceChildren();
        document.getElementById("detail-content").replaceChildren();
        addMeta(rankMap.get(item.rank) || "");
        addMeta(locationLabel(item));
        addDetail("简评", item.review);
        addDetail("备注", item.note);
        if (canOpenDianping(item)) {
          const actions = document.createElement("div");
          actions.className = "detail-actions";
          const link = document.createElement("a");
          link.className = "dianping-link";
          link.href = item.dianpingUrl;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.setAttribute("aria-label", "打开大众点评");
          link.title = "打开大众点评";
          actions.append(link);
          document.querySelector(".detail-top").insertBefore(actions, document.getElementById("detail-close"));
        }
        dialog.classList.remove("closing");
        dialog.showModal();
      }

      function closeDetail() {
        if (!dialog.open) return;
        dialog.classList.add("closing");
        const delay = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 160;
        setTimeout(() => {
          dialog.close();
          dialog.classList.remove("closing");
        }, delay);
      }

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".filter-control")) closeFilters();
        if (!searchFloat.contains(event.target) && searchFloat.classList.contains("is-open")) setSearchOpen(false);
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeFilters();
          setSearchOpen(false);
        }
      });
      searchToggle.addEventListener("click", () => setSearchOpen(!searchFloat.classList.contains("is-open")));
      searchInput.addEventListener("input", () => {
        searchQuery = searchInput.value;
        searchClear.hidden = !searchQuery;
        updateSearchVisibility(true);
        clearTimeout(searchHideTimer);
        render();
      });
      searchClear.addEventListener("click", () => {
        searchInput.value = "";
        searchInput.dispatchEvent(new Event("input"));
        searchInput.focus();
      });
      addEventListener("resize", () => requestAnimationFrame(syncMoreButtons), { passive: true });
      document.getElementById("detail-close").addEventListener("click", closeDetail);
      dialog.addEventListener("cancel", (event) => { event.preventDefault(); closeDetail(); });
      dialog.addEventListener("click", (event) => { if (event.target === dialog) closeDetail(); });
      addEventListener("scroll", () => {
        document.getElementById("filter-bar").classList.toggle("scrolled", scrollY > 8);
        revealSearchOnScroll();
      }, { passive: true });
      render();
    })();
  </script>
</body>
</html>
